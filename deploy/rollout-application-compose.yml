services:
  app:
    image: ${ROLLOUT_IMAGE:?fixed image digest required}
    container_name: ${ROLLOUT_CONTAINER:?container required}
    restart: unless-stopped
    env_file: ["${ROLLOUT_SERVICE_ENV:?private service env required}"]
    environment:
      TRUEROUTER_INSTANCE_ID: ${ROLLOUT_INSTANCE}
      TRUEROUTER_ROLLOUT_TOKEN_FILE: /run/rollout-token
    ports: ["127.0.0.1:${ROLLOUT_PORT}:8080"]
    volumes:
      - ${ROLLOUT_ROOT}/data:/app/data
      - ${ROLLOUT_SECRET_FILE}:/run/rollout-token:ro
    networks: [truerouter]
networks:
  truerouter:
    external: true
    name: ${ROLLOUT_NETWORK:?existing postgres and redis network required}
