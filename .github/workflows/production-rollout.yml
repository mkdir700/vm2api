name: Qualify and queue production rollout
on:
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  contents: read
  packages: read
concurrency:
  group: production-rollout
  cancel-in-progress: false
jobs:
  qualify:
    if: vars.ROLLOUT_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve fixed release image
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${RELEASE_REPOSITORY,,}:$RELEASE_TAG-amd64"
          docker pull "$image"
          docker image inspect "$image" > /tmp/rollout-image.json
          python3 - <<'PY'
          import json,os
          image=json.load(open('/tmp/rollout-image.json'))[0]
          prefix='ghcr.io/'+os.environ['RELEASE_REPOSITORY'].lower()+'@sha256:'
          ref=next(r for r in image['RepoDigests'] if r.startswith(prefix))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ROLLOUT_IMAGE='+ref+'\n')
          PY
      - name: Exercise exact image in isolated network
        run: |
          set -euo pipefail
          mkdir -p rollout-evidence
          docker run --rm --network none --entrypoint node \
            -v "$PWD/test:/opt/vm2api/test:ro" \
            -v "$PWD/rollout-evidence:/receipt" \
            -e ROLLOUT_E2E_OUT=/receipt/gateway \
            -e ROLLOUT_GROUP_OUT=/receipt/group \
            -e ROLLOUT_HANDOFF_OUT=/receipt/handoff \
            -e ROLLOUT_AUTHORITY_OUT=/receipt/authority \
            -e ROLLOUT_PACKAGE_OUT=/receipt/package \
            -w /opt/vm2api "$ROLLOUT_IMAGE" --test \
            test/e2e/session-rollout.e2e.test.mjs test/e2e/rollout-group.e2e.test.mjs \
            test/e2e/rollout-gateway-handoff.e2e.test.mjs test/e2e/rollout-authority.e2e.test.mjs \
            test/e2e/rollout-package.e2e.test.mjs
      - name: Bind qualification and queue deployment
        env:
          ROLLOUT_COMPONENT: vm2api
          ROLLOUT_EVIDENCE: rollout-evidence
          ROLLOUT_QUALIFICATION: rollout-qualification.json
          ROLLOUT_ENDPOINT: ${{ vars.ROLLOUT_ENDPOINT }}
          ROLLOUT_NOTIFICATION_SECRET: ${{ secrets.ROLLOUT_NOTIFICATION_SECRET }}
        run: |
          python3 .github/scripts/qualify-rollout.py
          python3 .github/scripts/notify-rollout.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-rollout-${{ github.event.workflow_run.head_sha }}
          path: |
            rollout-evidence/
            rollout-qualification.json
            rollout-notification.json
          if-no-files-found: ignore
